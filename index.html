<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>LifeBoard</title>
<!-- iPhone PWA -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LifeBoard">
<meta name="theme-color" content="#0d0d0d">
<link rel="apple-touch-icon" href="icon.png">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
<style>
:root{--bg:#0d0d0d;--bg-card:#1a1a1a;--bg-hover:#222;--text:#f0f0f0;--muted:#888;--border:#2a2a2a;--accent:#6c63ff;--success:#44bb44;--warn:#ffaa00;--danger:#ff4444;--sw:220px;}
[data-theme="light"]{--bg:#f5f5f5;--bg-card:#fff;--bg-hover:#f0f0f0;--text:#1a1a1a;--muted:#666;--border:#e0e0e0;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);display:flex;height:100vh;overflow:hidden;}
#sb{width:var(--sw);min-width:var(--sw);background:var(--bg-card);border-right:1px solid var(--border);display:flex;flex-direction:column;transition:width .25s,min-width .25s;overflow:hidden;z-index:100;}
#sb.col{width:56px;min-width:56px;}
.sb-logo{padding:18px 16px;font-weight:700;font-size:18px;color:var(--accent);display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);cursor:pointer;white-space:nowrap;}
.sb-logo .lbl{transition:opacity .2s;}
#sb.col .lbl{opacity:0;width:0;overflow:hidden;}
.sb-nav{flex:1;overflow-y:auto;padding:8px 0;}
.si{display:flex;align-items:center;gap:10px;padding:10px 16px;cursor:pointer;transition:background .15s;white-space:nowrap;font-size:14px;color:var(--muted);}
.si:hover{background:var(--bg-hover);color:var(--text);}
.si.active{color:var(--accent);background:rgba(108,99,255,.1);border-left:3px solid var(--accent);}
.si .ic{font-size:18px;min-width:22px;text-align:center;}
.si .lbl{transition:opacity .2s;}
#sb.col .si .lbl{opacity:0;width:0;overflow:hidden;}
.sbadge{margin-left:auto;background:var(--accent);color:#fff;border-radius:10px;font-size:10px;padding:2px 6px;min-width:18px;text-align:center;}
.sb-sec{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);padding:12px 16px 4px;}
#sb.col .sb-sec{display:none;}
.sb-foot{padding:12px 8px;border-top:1px solid var(--border);}
.rbtn{width:100%;background:rgba(255,68,68,.15);color:var(--danger);border:1px solid rgba(255,68,68,.3);border-radius:8px;padding:10px;cursor:pointer;font-size:13px;font-weight:600;}
.rbtn:hover{background:rgba(255,68,68,.25);}
#sb.col .rbtn{font-size:18px;padding:10px 0;}
#main{flex:1;overflow-y:auto;display:flex;flex-direction:column;}
#topbar{display:flex;align-items:center;gap:12px;padding:16px 24px;border-bottom:1px solid var(--border);background:var(--bg);position:sticky;top:0;z-index:50;}
#topbar h1{font-size:20px;font-weight:700;flex:1;}
.btn{padding:8px 16px;border-radius:8px;border:none;cursor:pointer;font-size:13px;font-weight:600;transition:all .15s;}
.btnp{background:var(--accent);color:#fff;}.btnp:hover{background:#5a52e0;}
.btng{background:transparent;color:var(--muted);border:1px solid var(--border);}.btng:hover{color:var(--text);}
.btnsm{padding:5px 10px;font-size:12px;}
#ct{flex:1;padding:24px;}
.card{background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:16px;}
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;}
.acard{border-radius:14px;padding:18px;cursor:pointer;border:1px solid rgba(255,255,255,.06);transition:transform .15s,box-shadow .15s;}
.acard:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.3);}
.pill{padding:4px 12px;border-radius:20px;font-size:12px;font-weight:600;}
.pc{background:rgba(255,68,68,.2);color:var(--danger);}
.pt{background:rgba(255,170,0,.2);color:var(--warn);}
.po{background:rgba(68,187,68,.2);color:var(--success);}
.pf{background:var(--bg-hover);color:var(--muted);}
.ptime{background:rgba(108,99,255,.15);color:var(--accent);}
.tlist{display:flex;flex-direction:column;gap:8px;margin-top:12px;}
.tc{background:var(--bg-card);border:1px solid var(--border);border-radius:10px;padding:14px 16px;cursor:pointer;transition:all .15s;border-left:4px solid transparent;display:flex;gap:12px;align-items:flex-start;}
.tc:hover{background:var(--bg-hover);}
.tc.lc{border-left-color:var(--danger);}
.tc.lt{border-left-color:var(--warn);}
.tc.ld{border-left-color:#4488ff;}
.tc.lb{border-left-color:#555;opacity:.6;}
.tc.lw{border-left-color:#aa66ff;}
.tcb{flex:1;min-width:0;}
.tct{font-weight:600;font-size:14px;margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tmeta{display:flex;gap:8px;flex-wrap:wrap;font-size:11px;color:var(--muted);}
.badge{padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600;}
.bc{background:rgba(255,68,68,.2);color:var(--danger);}
.bh{background:rgba(255,136,0,.2);color:#ff8800;}
.bm{background:rgba(255,204,0,.2);color:#ffcc00;}
.bl{background:rgba(68,187,68,.2);color:var(--success);}
.bb{background:rgba(100,100,100,.2);color:#888;}
.chk{width:20px;height:20px;border-radius:50%;border:2px solid var(--border);cursor:pointer;flex-shrink:0;margin-top:2px;transition:all .15s;}
.chk:hover{border-color:var(--success);background:rgba(68,187,68,.1);}
.mchip{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:16px;background:rgba(108,99,255,.15);color:var(--accent);font-size:12px;font-weight:600;cursor:pointer;border:1px solid rgba(108,99,255,.3);}
.fbar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
.chip{padding:5px 12px;border-radius:16px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;font-size:12px;transition:all .15s;}
.chip.active,.chip:hover{background:rgba(108,99,255,.15);border-color:var(--accent);color:var(--accent);}
.shdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.stitle{font-weight:700;font-size:15px;}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-bottom:20px;}
.mcard{background:var(--bg-card);border:1px solid var(--border);border-radius:10px;padding:14px;}
.pbar{background:var(--border);border-radius:4px;height:6px;overflow:hidden;}
.pfill{height:100%;background:var(--accent);border-radius:4px;transition:width .6s;}
.talert{background:rgba(255,170,0,.1);border:1px solid rgba(255,170,0,.3);border-radius:10px;padding:14px 18px;margin-bottom:20px;display:flex;justify-content:space-between;align-items:center;gap:12px;}
.sbanner{background:linear-gradient(135deg,rgba(255,140,0,.2),rgba(255,68,68,.1));border:1px solid rgba(255,140,0,.3);border-radius:12px;padding:16px 20px;display:flex;align-items:center;gap:12px;margin-bottom:20px;}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(60px);background:var(--bg-card);border:1px solid var(--border);border-radius:8px;padding:10px 20px;font-size:13px;opacity:0;transition:all .3s;pointer-events:none;z-index:9999;white-space:nowrap;}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1;}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;opacity:0;pointer-events:none;transition:opacity .25s;}
#ov.show{opacity:1;pointer-events:all;}
#pan{position:fixed;bottom:0;left:0;right:0;background:var(--bg-card);border-top:1px solid var(--border);border-radius:20px 20px 0 0;z-index:201;transform:translateY(100%);transition:transform .3s;max-height:90vh;overflow-y:auto;padding:24px;}
#pan.show{transform:translateY(0);}
.ph{width:40px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 20px;}
#fov{position:fixed;inset:0;background:var(--bg);z-index:300;display:none;flex-direction:column;align-items:center;justify-content:center;padding:32px;text-align:center;}
#fov.show{display:flex;}
#rov{position:fixed;inset:0;background:rgba(0,0,0,.96);z-index:400;display:none;flex-direction:column;align-items:center;justify-content:center;padding:32px;text-align:center;}
#rov.show{display:flex;}
input,textarea,select{font-family:inherit;}
/* PIN LOCK */
#pin-screen{position:fixed;inset:0;background:#0d0d0d;z-index:10000;display:none;flex-direction:column;align-items:center;justify-content:center;padding:env(safe-area-inset-top,32px) 32px 32px;}
.pd{width:18px;height:18px;border-radius:50%;border:2px solid #444;background:transparent;transition:all .15s;}
.pkey{background:#1a1a1a;border:1px solid #2a2a2a;border-radius:16px;color:#f0f0f0;font-size:22px;font-weight:600;width:80px;height:80px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:2px;transition:background .1s;-webkit-tap-highlight-color:transparent;}
.pkey:active{background:#2a2a2a;}
.pkey .pk-sub{font-size:8px;color:#555;letter-spacing:1px;font-weight:400;}
.pkey-del{font-size:18px;}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@keyframes pinpop{0%{transform:scale(.8);opacity:0}100%{transform:scale(1);opacity:1}}
@media(max-width:768px){
#sb{display:none;}
#bn{display:flex!important;position:fixed;bottom:0;left:0;right:0;background:var(--bg-card);border-top:1px solid var(--border);z-index:100;padding:8px 0;}
.bni{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;padding:4px;font-size:10px;color:var(--muted);}
.bni.active{color:var(--accent);}
.bni span{font-size:20px;}
#ct{padding:16px;padding-bottom:80px;}
}
#bn{display:none;}
</style>
</head>
<body>

<!-- PIN LOCK SCREEN -->
<div id="pin-screen">
  <div style="text-align:center;animation:pinpop .4s ease">
    <div style="font-size:56px;margin-bottom:10px">🧠</div>
    <div style="font-size:26px;font-weight:800;color:#f0f0f0;letter-spacing:-.5px">LifeBoard</div>

      <button class="pkey" onclick="pinTap('1')">1<span class="pk-sub"></span></button>
      <button class="pkey" onclick="pinTap('2')">2<span class="pk-sub">ABC</span></button>
      <button class="pkey" onclick="pinTap('3')">3<span class="pk-sub">DEF</span></button>
      <button class="pkey" onclick="pinTap('4')">4<span class="pk-sub">GHI</span></button>
      <button class="pkey" onclick="pinTap('5')">5<span class="pk-sub">JKL</span></button>
      <button class="pkey" onclick="pinTap('6')">6<span class="pk-sub">MNO</span></button>
      <button class="pkey" onclick="pinTap('7')">7<span class="pk-sub">PQRS</span></button>
      <button class="pkey" onclick="pinTap('8')">8<span class="pk-sub">TUV</span></button>
      <button class="pkey" onclick="pinTap('9')">9<span class="pk-sub">WXYZ</span></button>
      <button class="pkey" onclick="pinForgot()" style="font-size:11px;color:#555;background:transparent;border-color:transparent">forgot?</button>

<nav id="sb">
  <div class="sb-logo" onclick="tglSB()"><span style="font-size:22px">🧠</span><span class="lbl">LifeBoard</span></div>

    <div class="si" data-v="home" onclick="go('home')"><span class="ic">🏠</span><span class="lbl">Home</span></div>

  <div id="topbar">
    <h1 id="ptitle">Home</h1>

<script>
// ═══════════════════════════════════════
// PIN LOCK
// ═══════════════════════════════════════
const PIN_KEY='lb_pin',AUTH_KEY='lb_auth';
let pinBuf='',pinMode='enter',pinFirst='';

function pinInit(){
  const stored=localStorage.getItem(PIN_KEY);
  if(sessionStorage.getItem(AUTH_KEY)==='1'){pinUnlock();return;}
  const scr=document.getElementById('pin-screen');
  scr.style.display='flex';
  if(!stored){
    pinMode='setup1';
    document.getElementById('pin-sub').textContent='Choose a 4-digit PIN to protect your board';
    document.getElementById('pin-err').textContent='You\'ll need this every time you open LifeBoard';
  } else {
    pinMode='enter';
  }
}

function pinTap(d){
  if(pinBuf.length>=4)return;
  document.getElementById('pin-err').textContent='';
  pinBuf+=d;
  pinUpdDots();
  if(pinBuf.length===4)setTimeout(pinCheck,160);
}

function pinBack(){
  if(!pinBuf.length)return;
  pinBuf=pinBuf.slice(0,-1);
  pinUpdDots();
  document.getElementById('pin-err').textContent='';
}

function pinUpdDots(){
  document.querySelectorAll('.pd').forEach((el,i)=>{
    el.style.background=i<pinBuf.length?'#6c63ff':'transparent';
    el.style.borderColor=i<pinBuf.length?'#6c63ff':'#444';
    el.style.transform=i===pinBuf.length-1?'scale(1.3)':'scale(1)';
  });
}

function pinCheck(){
  const stored=localStorage.getItem(PIN_KEY);
  if(pinMode==='setup1'){
    if(pinBuf.length<4){pinBuf='';pinUpdDots();return;}
    pinFirst=pinBuf;pinBuf='';
    pinMode='setup2';
    document.getElementById('pin-sub').textContent='Confirm your PIN';
    document.getElementById('pin-err').textContent='';
    pinUpdDots();
  } else if(pinMode==='setup2'){
    if(pinBuf===pinFirst){
      localStorage.setItem(PIN_KEY,pinBuf);
      pinUnlock();
    } else {
      pinShake();
      document.getElementById('pin-err').textContent="PINs don't match — try again";
      setTimeout(()=>{pinBuf='';pinFirst='';pinMode='setup1';
        document.getElementById('pin-sub').textContent='Choose a 4-digit PIN';
        document.getElementById('pin-err').textContent='';
        pinUpdDots();},600);
    }
  } else {
    if(pinBuf===stored){
      pinUnlock();
    } else {
      pinShake();
      document.getElementById('pin-err').textContent='Wrong PIN — try again';
      setTimeout(()=>{pinBuf='';pinUpdDots();},400);
    }
  }
}

function pinUnlock(){
  sessionStorage.setItem(AUTH_KEY,'1');
  const scr=document.getElementById('pin-screen');
  scr.style.opacity='0';scr.style.transition='opacity .25s';
  setTimeout(()=>{scr.style.display='none';scr.style.opacity='';scr.style.transition='';},260);
  init();
}

function pinShake(){
  const el=document.getElementById('pin-dots');
  el.style.animation='none';
  requestAnimationFrame(()=>{el.style.animation='shake .4s ease';});
  setTimeout(()=>{el.style.animation='';},400);
}

function pinForgot(){
  if(confirm('Reset PIN? This will clear your saved PIN and ask you to set a new one.')){
    localStorage.removeItem(PIN_KEY);
    sessionStorage.removeItem(AUTH_KEY);
    pinBuf='';pinFirst='';
    pinMode='setup1';
    document.getElementById('pin-sub').textContent='Choose a new 4-digit PIN';
    document.getElementById('pin-err').textContent='';
    pinUpdDots();
  }
}

function pinChangeTrigger(){
  // Called from Settings to change PIN
  sessionStorage.removeItem(AUTH_KEY);
  localStorage.removeItem(PIN_KEY);
  const scr=document.getElementById('pin-screen');
  scr.style.display='flex';
  pinBuf='';pinFirst='';
  pinMode='setup1';
  document.getElementById('pin-sub').textContent='Choose a new PIN';
  document.getElementById('pin-err').textContent='';
  pinUpdDots();
}

function dfn(n){const d=new Date();d.setDate(d.getDate()+n);if(n===0)d.setHours(23,59,0,0);return d.toISOString();}
function ft(h){if(h<1)return Math.round(h*60)+'min';if(h===Math.floor(h))return h+'h';return Math.floor(h)+'h '+Math.round((h%1)*60)+'min';}
function rd(iso){if(!iso)return'';const d=new Date(iso),n=new Date(),df=Math.round((d-n)/86400000);if(df<0)return`${Math.abs(df)}d overdue`;if(df===0)return'Today';if(df===1)return'Tomorrow';if(df<7)return`In ${df}d`;return d.toLocaleDateString('en-US',{month:'short',day:'numeric'});}
function cp(s){return s?s[0].toUpperCase()+s.slice(1):s;}
function isToday(i){return i&&new Date(i).toDateString()===new Date().toDateString();}
function isYest(i){if(!i)return false;const y=new Date();y.setDate(y.getDate()-1);return new Date(i).toDateString()===y.toDateString();}

// SCHEDULING ENGINE
function slk(t,now=new Date()){if(!t.dueDate)return Infinity;return(new Date(t.dueDate)-now)/3600000-t.timeHours;}
function blk(t){return t.prerequisites.some(p=>{const x=DB.tasks.find(q=>q.id===p);return x&&x.status!=='done';});}
function inWin(t,now=new Date()){if(!t.timeWindow)return true;const d=now.getDay(),h=now.getHours();return t.timeWindow.days.includes(d)&&h>=t.timeWindow.startHour&&h<t.timeWindow.endHour;}
function pri(t,now=new Date()){
  if(t.status==='done')return 0;
  if(blk(t))return -1;
  if(t.earliestStart&&new Date(t.earliestStart)>now)return -1;
  if(t.timeWindow&&!inWin(t,now))return -0.5;
  const base=t.weight/t.timeHours;
  const s=slk(t,now);
  const urg=s<4?8:s<24?4:s<168?2:0;
  const dep=DB.tasks.filter(x=>x.prerequisites.includes(t.id)&&x.status!=='done').length*5;
  const age=Math.min((now-new Date(t.createdAt))/(7*24*3600000)*0.5,5);
  return base+urg+dep+age;
}
function bdg(sc){
  if(sc<0)return{l:'Blocked',c:'bb',e:'🔒'};
  if(sc>=10)return{l:'Critical',c:'bc',e:'🔴'};
  if(sc>=6)return{l:'High',c:'bh',e:'🟠'};
  if(sc>=3)return{l:'Medium',c:'bm',e:'🟡'};
  return{l:'Low',c:'bl',e:'🟢'};
}
function si(t,now=new Date()){
  const s=slk(t,now);
  if(s===Infinity)return{txt:'Flexible',pc:'pf',bc:''};
  if(s<0)return{txt:'⚠ Missed',pc:'pc',bc:'lc'};
  if(s<4)return{txt:`⚠ ${s.toFixed(1)}h slack`,pc:'pc',bc:'lc'};
  if(s<24)return{txt:`${s.toFixed(0)}h slack`,pc:'pt',bc:'lt'};
  return{txt:`${Math.floor(s/24)}d slack`,pc:'po',bc:'ld'};
}
function srt(tasks){
  const m=DB.settings.schedulingMode,now=new Date();
  const sc=tasks.map(t=>({...t,_s:pri(t,now)}));
  if(m==='edd')return sc.sort((a,b)=>{if(!a.dueDate&&!b.dueDate)return b._s-a._s;if(!a.dueDate)return 1;if(!b.dueDate)return -1;return new Date(a.dueDate)-new Date(b.dueDate);});
  return sc.sort((a,b)=>b._s-a._s);
}
function topT(){
  const e=DB.settings.energyLevel;
  const s=srt(DB.tasks.filter(t=>t.status!=='done'&&t.status!=='snoozed'&&!(e==='low'&&t.energyRequired==='high')));
  return s.find(t=>t._s>0)||s[0]||null;
}
function thrash(){return DB.tasks.filter(t=>t.status==='inprogress').length>6||(DB.metrics?.repriCount||0)>3;}

  updBadge();render();

}
function render(){

  document.getElementById('ptitle').textContent=CA?AR.find(a=>a.id===CA)?.label||'Area':cp(V);
  if(V==='home')c.innerHTML=rHome();

}

  // Filter + tasks
  h+=`<div class="shdr"><span class="stitle">Tasks (${pending.length})</span><button class="btn btnp btnsm" onclick="openForm(null,'${aid}')">+ Add</button></div>
  <div class="fbar">${['all','pending','inprogress','blocked','done'].map(f=>`<button class="chip${AF===f?' active':''}" onclick="setF('${f}','${aid}')">${cp(f)}</button>`).join('')}</div>
  <div class="tlist">`;
  let ft=srt(pending);
  if(AF==='pending')ft=srt(tasks.filter(t=>t.status==='pending'));
  else if(AF==='inprogress')ft=srt(tasks.filter(t=>t.status==='inprogress'));
  else if(AF==='blocked')ft=srt(pending.filter(t=>blk(t)));
  else if(AF==='done')ft=tasks.filter(t=>t.status==='done');
  ft.forEach(t=>{h+=rTC(t,now);});
  if(!ft.length)h+=`<div style="text-align:center;padding:32px;color:var(--muted)">No tasks here. <span style="color:var(--accent);cursor:pointer" onclick="openForm(null,'${aid}')">Add one →</span></div>`;
  h+=`</div>`;
  return h;
}

function rTC(t,now=new Date()){
  const sc=pri(t,now),b=bdg(sc),s=si(t,now),bkd=blk(t),w=!!t.timeWindow;
  const bc=bkd?'lb':w?'lw':s.bc;
  const agW=(now-new Date(t.createdAt))/(7*24*3600000);
  return `<div class="tc ${bc}" onclick="openDet('${t.id}')">
    <div class="chk" onclick="event.stopPropagation();doneT('${t.id}')"></div>
    <div class="tcb">
      <div class="tct">${t.title}${bkd?' 🔒':''}${w?' 🪟':''}</div>
      <div class="tmeta">
        <span class="badge ${b.c}">${b.e} ${sc>0?sc.toFixed(1):'–'}</span>
        <span>⏱ ${ft(t.timeHours)}</span>
        ${t.dueDate?`<span>📅 ${rd(t.dueDate)}</span>`:''}
        <span class="${s.pc}" style="padding:2px 6px;border-radius:8px">${s.txt}</span>
        <span>${{low:'🔋',medium:'⚡',high:'🚀'}[t.energyRequired]||''}</span>
        ${agW>4?`<span style="color:var(--warn)">🕰 ${Math.floor(agW)}w</span>`:''}
        <span class="badge" style="background:var(--bg-hover);color:var(--muted);text-transform:capitalize">${t.status}</span>
      </div>
    </div>
  </div>`;
}

// DETAIL PANEL

  </div>
  ${t.notes?`<p style="color:var(--muted);font-size:13px;margin-bottom:14px">${t.notes}</p>`:''}
  <div class="card" style="margin-bottom:14px">
    <div style="font-size:11px;color:var(--muted);margin-bottom:6px">Priority Score</div>
    <div style="font-size:13px;line-height:1.9">
      Base (${t.weight}÷${t.timeHours}): <strong>${base}</strong><br>
      Urgency: <strong>+${urg}</strong> · Dependencies: <strong>+${depB}</strong> · Age: <strong>+${agB}</strong><br>
      <span style="border-top:1px solid var(--border);display:block;padding-top:6px;margin-top:4px">
        Total: <strong>${sc>0?sc.toFixed(2):'Blocked'}</strong> <span class="badge ${b.c}" style="margin-left:6px">${b.e} ${b.l}</span>
      </span>
    </div>
  </div>
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px">
    <span class="pill ${s.pc}">${s.txt}</span>
    <span class="pill ptime">⏱ ${ft(t.timeHours)}</span>
    ${t.dueDate?`<span class="pill pf">📅 ${rd(t.dueDate)}</span>`:''}
    ${t.timeWindow?`<span class="pill" style="background:rgba(170,102,255,.15);color:#aa66ff">🪟 ${t.timeWindow.days.map(d=>['S','M','T','W','T','F','S'][d]).join('')} ${t.timeWindow.startHour}–${t.timeWindow.endHour}h</span>`:''}
  </div>
  ${prs.length?`<div style="margin-bottom:12px"><div style="font-size:12px;color:var(--muted);margin-bottom:4px">Requires:</div>${prs.join('')}</div>`:''}
  ${deps.length?`<div style="margin-bottom:14px"><div style="font-size:12px;color:var(--muted);margin-bottom:4px">Unlocks:</div><div style="font-size:13px;color:var(--success)">✨ ${deps.map(d=>d.title).join(', ')}</div></div>`:''}
  ${bkd?`<div style="background:rgba(255,68,68,.1);border:1px solid rgba(255,68,68,.2);border-radius:8px;padding:12px;margin-bottom:14px;font-size:13px;color:var(--danger)">🔒 Blocked — complete prerequisites first</div>`:''}
  <div style="display:flex;gap:10px;margin-bottom:14px">

  </div>
  <details style="margin-bottom:14px">
    <summary style="cursor:pointer;font-size:13px;color:var(--muted);user-select:none">😰 I'm Stuck — help me</summary>
    <div style="display:flex;flex-direction:column;gap:8px;margin-top:10px">
      <button class="btn btng" onclick="snz('${id}',1)">💤 Snooze 1 day</button>

      <button class="btn btng" onclick="closePan();go('area','${t.areas[0]}')">↩ See all tasks in ${area?.label}</button>
      <div style="background:var(--bg);border-radius:8px;padding:10px;font-size:13px;color:var(--muted);line-height:1.6">

// TASK FORM (Phase 2: prerequisites, recurrence, time window)
function openForm(id,defA){
  const t=id?DB.tasks.find(x=>x.id===id):null,isE=!!t;

  tfPre=t?[...t.prerequisites]:[];
  const otherTasks=DB.tasks.filter(x=>x.id!==id&&x.status!=='done');
  const preLabels=tfPre.map(pid=>{const p=DB.tasks.find(x=>x.id===pid);return p?`<span style="display:inline-flex;align-items:center;gap:4px;background:rgba(108,99,255,.15);color:var(--accent);padding:3px 8px;border-radius:12px;font-size:12px;margin:2px">${p.title}<span onclick="remPre('${pid}')" style="cursor:pointer;margin-left:2px">✕</span></span>`:'';}).join('');
  const twDays=t?.timeWindow?.days||[];
  const twOn=!!t?.timeWindow;

  let h=`<h3 style="margin-bottom:20px">${isE?'Edit Task':'New Task'}</h3>
  <div style="display:flex;flex-direction:column;gap:14px">
    <div><label style="font-size:12px;color:var(--muted)">Title *</label>
      <input id="tf-t" value="${t?.title||''}" placeholder="What needs to be done?"
        style="width:100%;margin-top:4px;padding:10px 12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:14px"></div>

    <div><label style="font-size:12px;color:var(--muted)">Life Area (max 2)</label>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px" id="tf-areas">
        ${AR.map(a=>`<button class="chip${sa.includes(a.id)?' active':''}" data-a="${a.id}" onclick="tglA('${a.id}')">${a.e} ${a.label}</button>`).join('')}
      </div></div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
      <div><label style="font-size:12px;color:var(--muted)">Weight (importance)</label>
        <input id="tf-w" type="range" min="1" max="10" value="${t?.weight||5}" oninput="document.getElementById('tf-wv').textContent=this.value;lscore()" style="width:100%;margin-top:8px;accent-color:var(--accent)">
        <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--muted)">
          <span>Nice</span><span id="tf-wv" style="color:var(--accent);font-weight:700">${t?.weight||5}</span><span>Life-changing</span>
        </div></div>
      <div><label style="font-size:12px;color:var(--muted)">Energy needed</label>
        <div style="display:flex;gap:4px;margin-top:8px" id="tf-en">
          ${['low','medium','high'].map(e=>`<button class="chip${(t?.energyRequired||'medium')===e?' active':''}" data-en="${e}" onclick="pickEn('${e}')" style="flex:1;font-size:13px">${{low:'🔋',medium:'⚡',high:'🚀'}[e]}</button>`).join('')}
        </div></div>
    </div>

    <div><label style="font-size:12px;color:var(--muted)">Time Estimate</label>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px" id="tf-time">
        ${[0.25,0.5,1,2,4,6].map(h=>`<button class="chip${(t?.timeHours||1)===h?' active':''}" data-h="${h}" onclick="pickH(${h})">${ft(h)}</button>`).join('')}
      </div></div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
      <div><label style="font-size:12px;color:var(--muted)">Due Date</label>
        <input id="tf-due" type="date" value="${t?.dueDate?t.dueDate.split('T')[0]:''}" oninput="lscore()"
          style="width:100%;margin-top:4px;padding:8px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text)"></div>
      <div><label style="font-size:12px;color:var(--muted)">Complexity</label>
        <div style="display:flex;gap:4px;margin-top:8px" id="tf-cplx">
          ${['😴','😐','😓','😤','🤯'].map((e,i)=>`<button class="chip${(t?.complexity||3)===(i+1)?' active':''}" data-c="${i+1}" onclick="pickC(${i+1})" style="flex:1">${e}</button>`).join('')}
        </div></div>
    </div>

    <div><label style="font-size:12px;color:var(--muted)">Recurrence</label>
      <div style="display:flex;gap:6px;margin-top:6px" id="tf-rec">
        ${['none','daily','weekly','monthly'].map(r=>`<button class="chip${(t?.recurrence||'none')===r?' active':''}" data-r="${r}" onclick="pickR('${r}')" style="flex:1;text-transform:capitalize">${r}</button>`).join('')}
      </div></div>

    <div>
      <label style="font-size:12px;color:var(--muted)">Prerequisites <span style="font-weight:400">(must be done before this)</span></label>
      <div id="tf-pre-chips" style="display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;min-height:28px">${preLabels}</div>
      <input id="tf-pre-search" placeholder="Search tasks to link as prerequisite..." oninput="searchPre(this.value,'${id||''}')"
        style="width:100%;margin-top:6px;padding:8px 12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:13px">
      <div id="tf-pre-results" style="display:flex;flex-direction:column;gap:4px;margin-top:6px;max-height:120px;overflow-y:auto"></div>
    </div>

    <details ${twOn?'open':''}>
      <summary style="cursor:pointer;font-size:12px;color:var(--muted);user-select:none;margin-bottom:8px">🪟 Time Window (optional — task only schedulable during this window)</summary>
      <div style="display:flex;flex-direction:column;gap:10px;padding:10px;background:var(--bg);border-radius:8px">
        <div><label style="font-size:11px;color:var(--muted)">Allowed days</label>
          <div style="display:flex;gap:4px;margin-top:6px">
            ${['Su','Mo','Tu','We','Th','Fr','Sa'].map((d,i)=>`<button class="chip${twDays.includes(i)?' active':''}" data-wd="${i}" onclick="tglWd(${i})" style="flex:1;padding:4px;font-size:11px">${d}</button>`).join('')}
          </div></div>
        <div style="display:flex;gap:12px;align-items:center">
          <div style="flex:1"><label style="font-size:11px;color:var(--muted)">From hour</label>
            <input id="tf-wsh" type="number" min="0" max="23" value="${t?.timeWindow?.startHour??9}"
              style="width:100%;margin-top:4px;padding:6px;background:var(--bg-card);border:1px solid var(--border);border-radius:6px;color:var(--text)"></div>
          <span style="color:var(--muted);margin-top:16px">→</span>
          <div style="flex:1"><label style="font-size:11px;color:var(--muted)">Until hour</label>
            <input id="tf-weh" type="number" min="1" max="24" value="${t?.timeWindow?.endHour??18}"
              style="width:100%;margin-top:4px;padding:6px;background:var(--bg-card);border:1px solid var(--border);border-radius:6px;color:var(--text)"></div>
        </div>
        <div style="font-size:11px;color:var(--muted)">Leave days unchecked to remove time window</div>
      </div>
    </details>

    <div><label style="font-size:12px;color:var(--muted)">Notes</label>
      <textarea id="tf-n" rows="2" style="width:100%;margin-top:4px;padding:10px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:13px;resize:vertical">${t?.notes||''}</textarea></div>

    <div id="tf-sc" style="text-align:center;padding:10px;background:var(--bg);border-radius:8px;font-size:13px;color:var(--muted)">Priority score preview</div>
    <button class="btn btnp" onclick="saveT('${id||''}')" style="padding:12px;font-size:15px">${isE?'Save Changes':'Create Task'}</button>
  </div>`;
  showPan(h);
  setTimeout(()=>{lscore();searchPre('',id||'');},80);
}
function tglA(aid){const b=document.querySelector(`[data-a="${aid}"]`);if(!b)return;const n=document.querySelectorAll('[data-a].active').length;if(!b.classList.contains('active')&&n>=2){toast('Max 2 areas');return;}b.classList.toggle('active');lscore();}
function pickH(h){document.querySelectorAll('[data-h]').forEach(b=>b.classList.toggle('active',b.dataset.h==h));lscore();}
function pickEn(e){document.querySelectorAll('[data-en]').forEach(b=>b.classList.toggle('active',b.dataset.en===e));}
function pickC(c){document.querySelectorAll('[data-c]').forEach(b=>b.classList.toggle('active',b.dataset.c==c));}
function pickR(r){document.querySelectorAll('[data-r]').forEach(b=>b.classList.toggle('active',b.dataset.r===r));}
function tglWd(d){const b=document.querySelector(`[data-wd="${d}"]`);if(b)b.classList.toggle('active');}
function searchPre(q,excludeId){
  const res=document.getElementById('tf-pre-results');if(!res)return;
  const candidates=DB.tasks.filter(t=>t.id!==excludeId&&t.status!=='done'&&!tfPre.includes(t.id)&&(!q||t.title.toLowerCase().includes(q.toLowerCase())));
  if(!candidates.length){res.innerHTML=q?`<div style="font-size:12px;color:var(--muted);padding:4px">No matching tasks</div>`:'';return;}
  res.innerHTML=candidates.slice(0,6).map(t=>{const a=AR.find(x=>x.id===t.areas[0]);
    return`<div onclick="selPre('${t.id}','${excludeId}')" style="padding:8px 10px;background:var(--bg-card);border:1px solid var(--border);border-radius:6px;cursor:pointer;font-size:13px;display:flex;gap:6px;align-items:center">
      <span>${a?.e||''}</span><span style="flex:1">${t.title}</span><span style="color:var(--accent);font-size:11px">+ Add</span></div>`;}).join('');
}
function selPre(pid,excludeId){
  if(tfPre.includes(pid))return;
  tfPre.push(pid);
  const chips=document.getElementById('tf-pre-chips');
  if(chips){const p=DB.tasks.find(x=>x.id===pid);if(p)chips.innerHTML+=`<span style="display:inline-flex;align-items:center;gap:4px;background:rgba(108,99,255,.15);color:var(--accent);padding:3px 8px;border-radius:12px;font-size:12px;margin:2px" id="pre-chip-${pid}">${p.title}<span onclick="remPre('${pid}')" style="cursor:pointer;margin-left:2px">✕</span></span>`;}
  const si=document.getElementById('tf-pre-search');
  searchPre(si?.value||'',excludeId);
}
function remPre(pid){
  tfPre=tfPre.filter(x=>x!==pid);
  const c=document.getElementById(`pre-chip-${pid}`);if(c)c.remove();
  const si=document.getElementById('tf-pre-search');
  const excludeId=document.querySelector('.btn.btnp[onclick*="saveT"]')?.getAttribute('onclick')?.match(/'([^']*)'/)?.[1]||'';
  searchPre(si?.value||'',excludeId);
}
function lscore(){
  const w=parseInt(document.getElementById('tf-w')?.value||5);
  const th=parseFloat(document.querySelector('[data-h].active')?.dataset.h||1);
  const dv=document.getElementById('tf-due')?.value;
  const due=dv?new Date(dv+'T23:59:00'):null;
  const s=due?(due-new Date())/3600000-th:Infinity;
  const urg=s<4?8:s<24?4:s<168?2:0;
  const sc=w/th+urg,b=bdg(sc);
  const el=document.getElementById('tf-sc');
  if(el)el.innerHTML=`Priority: <strong class="${b.c}" style="font-size:16px">${b.e} ${sc.toFixed(1)}</strong> — ${b.l}`;
}
function saveT(id){
  const title=document.getElementById('tf-t')?.value?.trim();if(!title){toast('Title required');return;}
  const areas=[...document.querySelectorAll('[data-a].active')].map(b=>b.dataset.a);if(!areas.length){toast('Select an area');return;}
  const weight=parseInt(document.getElementById('tf-w')?.value||5);
  const timeHours=parseFloat(document.querySelector('[data-h].active')?.dataset.h||1);
  const complexity=parseInt(document.querySelector('[data-c].active')?.dataset.c||3);
  const energyRequired=document.querySelector('[data-en].active')?.dataset.en||'medium';
  const dv=document.getElementById('tf-due')?.value;
  const dueDate=dv?new Date(dv+'T23:59:00').toISOString():null;
  const recurrence=document.querySelector('[data-r].active')?.dataset.r||'none';
  const notes=document.getElementById('tf-n')?.value||'';
  const wdSel=[...document.querySelectorAll('[data-wd].active')].map(b=>parseInt(b.dataset.wd));
  const timeWindow=wdSel.length?{days:wdSel,startHour:parseInt(document.getElementById('tf-wsh')?.value||9),endHour:parseInt(document.getElementById('tf-weh')?.value||18)}:null;
  const prerequisites=[...tfPre];
  if(id){const t=DB.tasks.find(x=>x.id===id);if(t)Object.assign(t,{title,areas,weight,timeHours,complexity,energyRequired,dueDate,notes,recurrence,prerequisites,timeWindow});}
  else DB.tasks.push({id:'t'+Date.now(),title,areas,weight,timeHours,complexity,energyRequired,dueDate,earliestStart:null,timeWindow,prerequisites,status:'pending',notes,createdAt:new Date().toISOString(),completedAt:null,snoozedUntil:null,recurrence});
  if(!DB.metrics)DB.metrics={tasksToday:0,focusMin:0,repriCount:0,streak:5,lastStreak:dfn(-1)};
  DB.metrics.repriCount=(DB.metrics.repriCount||0)+1;
  saveDB();closePan();render();toast(id?'Updated ✓':'Task created ✓');
}

// FOCUS
function startFocus(id){
  const t=DB.tasks.find(x=>x.id===id);if(!t)return;
  fId=id;const a=AR.find(x=>x.id===t.areas[0]),s=si(t);
  const deps=DB.tasks.filter(x=>x.prerequisites.includes(id)&&x.status!=='done');
  document.getElementById('fo-area').textContent=`${a?.e||''} ${a?.label||''} · Focus Mode`;
  document.getElementById('fo-title').textContent=t.title;
  document.getElementById('fo-goal').textContent=DB.areaData[t.areas[0]]?.goals?.[0]?`→ ${DB.areaData[t.areas[0]].goals[0].title}`:'';
  document.getElementById('fo-slack').innerHTML=`<span class="${s.pc}" style="padding:3px 10px;border-radius:12px">${s.txt}</span>`+(deps.length?` · <span style="color:var(--success)">✨ Unlocks ${deps.length}</span>`:'');
  if(t.status!=='done'){t.status='inprogress';saveDB();}
  fLen=25;fSec=1500;fRun=false;if(fTmr)clearInterval(fTmr);
  updF();document.getElementById('fov').classList.add('show');
}
function closeFocus(){if(fTmr)clearInterval(fTmr);fTmr=null;fRun=false;document.getElementById('fov').classList.remove('show');}
function setFL(m){fLen=m;fSec=m*60;if(fTmr)clearInterval(fTmr);fRun=false;document.getElementById('fo-btn').textContent='▶ Start';document.querySelectorAll('#flbtns .chip').forEach(b=>b.classList.toggle('active',b.textContent.trim()===m+'m'));updF();}
function tglTimer(){
  if(fRun){clearInterval(fTmr);fRun=false;document.getElementById('fo-btn').textContent='▶ Resume';}
  else{fRun=true;document.getElementById('fo-btn').textContent='⏸ Pause';
    fTmr=setInterval(()=>{fSec--;if(!DB.metrics)DB.metrics={};DB.metrics.focusMin=(DB.metrics.focusMin||0)+1/60;updF();
      if(fSec<=0){clearInterval(fTmr);fRun=false;document.getElementById('fo-btn').textContent='▶ Start';chime();toast('🎉 Session done! Take a break.');}},1000);}
}

// TASK ACTIONS
function doneT(id){
  const t=DB.tasks.find(x=>x.id===id);if(!t)return;
  t.status='done';t.completedAt=new Date().toISOString();
  DB.completedTasks.unshift({id:t.id+'_d',title:t.title,areas:t.areas,completedAt:t.completedAt,weight:t.weight,timeHours:t.timeHours});
  if(!DB.metrics)DB.metrics={};DB.metrics.tasksToday=(DB.metrics.tasksToday||0)+1;
  // Handle recurrence — create next occurrence
  if(t.recurrence&&t.recurrence!=='none'){
    const next={...t,id:'t'+Date.now(),status:'pending',completedAt:null,snoozedUntil:null,createdAt:new Date().toISOString()};
    if(t.dueDate){
      const nd=new Date(t.dueDate);
      if(t.recurrence==='daily')nd.setDate(nd.getDate()+1);
      else if(t.recurrence==='weekly')nd.setDate(nd.getDate()+7);
      else if(t.recurrence==='monthly')nd.setMonth(nd.getMonth()+1);
      next.dueDate=nd.toISOString();
    }
    DB.tasks.push(next);
  }
  updStreak();saveDB();closePan();render();
  confetti({particleCount:80,spread:70,origin:{y:0.7},colors:['#6c63ff','#44bb44','#ffaa00','#ff6688']});
  const ul=DB.tasks.filter(x=>x.prerequisites.includes(id)&&x.status!=='done'&&!blk(x));
  const rec=t.recurrence!=='none'?` · ♻️ Next ${t.recurrence} task created`:'';
  toast(ul.length?`✅ Done! Unlocked: ${ul[0].title}`:(`✅ Task complete!${rec}`));
}
function chgSt(id,s){const t=DB.tasks.find(x=>x.id===id);if(!t)return;if(s==='done'){doneT(id);return;}t.status=s;saveDB();closePan();render();}

function delT(id){if(!confirm('Delete this task?'))return;DB.tasks=DB.tasks.filter(x=>x.id!==id);DB.tasks.forEach(t=>{t.prerequisites=t.prerequisites.filter(p=>p!==id);});saveDB();closePan();render();}

function buildChains(tasks){
  const chains=[];
  tasks.filter(t=>t.prerequisites.length===0).forEach(root=>{
    const ch=[root];let cur=root;
    while(true){const next=tasks.find(t=>t.prerequisites.includes(cur.id));if(!next||ch.includes(next))break;ch.push(next);cur=next;}
    if(ch.length>1)chains.push(ch);
  });
  return chains;
}

// PHASE 2: MOORE'S TRIAGE SCREEN
// ═══════════════════════════════════════
function rTriage(){
  const cap=DB.settings.dailyCapacityHours;
  const candidates=srt(DB.tasks.filter(t=>t.status!=='done'&&t.status!=='snoozed'&&t._s>0||pri(t)>0));
  const withDue=srt(DB.tasks.filter(t=>t.status!=='done'&&t.dueDate&&pri(t)>0)).sort((a,b)=>new Date(a.dueDate)-new Date(b.dueDate));
  const noDue=srt(DB.tasks.filter(t=>t.status!=='done'&&!t.dueDate&&pri(t)>0));

  // Moore's Algorithm
  let schedule=[],totalTime=0,dropped=[];
  const now=new Date();
  withDue.forEach(task=>{
    schedule.push(task);totalTime+=task.timeHours;
    const hoursLeft=(new Date(task.dueDate)-now)/3600000;
    if(totalTime>hoursLeft){
      const longestIdx=schedule.reduce((mi,t,i,arr)=>t.timeHours>arr[mi].timeHours?i:mi,0);
      const d=schedule[longestIdx];
      dropped.push({...d,_dropReason:`Saves ${d.timeHours}h — protects ${schedule.length-1} deadline${schedule.length>2?'s':''}`});
      totalTime-=d.timeHours;schedule.splice(longestIdx,1);
    }
  });
  const keep=[...schedule,...noDue];
  const droppedIds=dropped.map(x=>x.id);

  let h=`<div style="max-width:700px">
  <div class="card" style="margin-bottom:20px">
    <div style="font-size:22px;font-weight:800;margin-bottom:6px">🧹 Triage Mode</div>
    <div style="font-size:13px;color:var(--muted);line-height:1.6">Based on <strong>Moore's Algorithm</strong> — minimises the number of tasks that go late. Given your ${cap}h capacity, here's what to protect and what to let go.</div>
  </div>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px">
    <div>
      <div style="font-weight:700;font-size:14px;color:var(--success);margin-bottom:10px">✅ KEEP — these stay on track (${keep.length})</div>
      <div style="display:flex;flex-direction:column;gap:8px">`;
  keep.forEach((t,i)=>{
    const a=AR.find(x=>x.id===t.areas[0]),s=si(t,now);
    h+=`<div class="card" style="border-left:3px solid var(--success);cursor:pointer" onclick="openDet('${t.id}')">
      <div style="font-size:13px;font-weight:600">${i+1}. ${a?.e} ${t.title}</div>
      <div style="font-size:11px;color:var(--muted);margin-top:4px">⏱ ${ft(t.timeHours)} ${t.dueDate?`· 📅 ${rd(t.dueDate)}`:'· No deadline'}</div>
    </div>`;
  });
  h+=`</div></div>
    <div>
      <div style="font-weight:700;font-size:14px;color:var(--danger);margin-bottom:10px">⚠ DROP or DEFER — saves the rest (${dropped.length})</div>
      <div style="display:flex;flex-direction:column;gap:8px">`;
  if(!dropped.length){
    h+=`<div style="text-align:center;padding:20px;color:var(--muted)">Nothing needs dropping — your schedule fits! 🎉</div>`;
  }
  dropped.forEach(t=>{
    const a=AR.find(x=>x.id===t.areas[0]);
    h+=`<div class="card" style="border-left:3px solid var(--danger)">
      <div style="font-size:13px;font-weight:600">${a?.e} ${t.title}</div>
      <div style="font-size:11px;color:var(--danger);margin-top:3px">${t._dropReason}</div>
      <div style="display:flex;gap:6px;margin-top:8px">
        <button class="btn btng btnsm" onclick="snz('${t.id}',7)">Defer 1 week</button>
        <button class="btn btng btnsm" onclick="delT('${t.id}')" style="color:var(--danger)">Drop it</button>
      </div>
    </div>`;
  });
  h+=`</div></div>
  </div>

  <div class="card" style="background:rgba(108,99,255,.06);border-color:rgba(108,99,255,.2)">
    <div style="font-size:12px;color:var(--muted);line-height:1.7">
      <strong style="color:var(--text)">How this works:</strong> Moore's Algorithm schedules tasks by earliest due date. When adding a task would cause you to miss a deadline, it finds the longest task already scheduled and removes it — since that's the biggest time-sink. This minimises the <em>number</em> of late tasks, not the lateness itself.<br>
      <span style="color:var(--accent)">From "Algorithms to Live By" — Brian Christian & Tom Griffiths</span>
    </div>
  </div>
  <div style="margin-top:16px;display:flex;gap:10px">
    <button class="btn btnp" onclick="go('schedule')">← Back to Schedule</button>
    <button class="btn btng" onclick="go('home')">Go Home</button>
  </div>
  </div>`;
  return h;
}

// ═══════════════════════════════════════
// PHASE 2: METRIC INLINE EDIT
// ═══════════════════════════════════════
function editMetric(aid,mid){
  const data=DB.areaData[aid];if(!data)return;
  const m=data.metrics.find(x=>x.id===mid);if(!m)return;
  let h=`<h3 style="margin-bottom:16px">Update Metric</h3>
  <div class="card" style="margin-bottom:16px">
    <div style="font-size:12px;color:var(--muted);margin-bottom:4px">${m.name}</div>
    <div style="font-size:14px;color:var(--muted)">Target: ${m.target}</div>
  </div>
  <div style="margin-bottom:16px">
    <label style="font-size:12px;color:var(--muted)">Current Value</label>
    <input id="m-cur" type="number" value="${m.current}" step="0.5"
      style="width:100%;margin-top:6px;padding:12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:20px;font-weight:700;text-align:center">
    <input type="range" min="0" max="${m.target*1.5}" step="0.5" value="${m.current}"
      oninput="document.getElementById('m-cur').value=this.value"
      style="width:100%;margin-top:10px;accent-color:var(--accent)">
    <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--muted)"><span>0</span><span>Target: ${m.target}</span></div>
  </div>
  <div style="display:flex;gap:10px;margin-bottom:10px">
    <button class="btn btnp" style="flex:1" onclick="saveMetric('${aid}','${mid}')">Update</button>
    <button class="btn btng btnsm" style="color:var(--danger)" onclick="delMetric('${aid}','${mid}')">Delete Metric</button>
  </div>`;
  showPan(h);
}
function saveMetric(aid,mid){
  const v=parseFloat(document.getElementById('m-cur')?.value||0);
  const m=DB.areaData[aid]?.metrics?.find(x=>x.id===mid);
  if(m){m.current=v;saveDB();closePan();render();toast('Metric updated ✓');}
}
function delMetric(aid,mid){
  if(!confirm('Delete this metric?'))return;
  if(DB.areaData[aid])DB.areaData[aid].metrics=DB.areaData[aid].metrics.filter(x=>x.id!==mid);
  saveDB();closePan();render();
}

// ═══════════════════════════════════════
// PHASE 2: GOAL STATUS CYCLE
// ═══════════════════════════════════════
function cycleGoal(aid,gid){
  const g=DB.areaData[aid]?.goals?.find(x=>x.id===gid);if(!g)return;
  const ord=['active','paused','done'];
  g.status=ord[(ord.indexOf(g.status)+1)%ord.length];
  saveDB();render();
  toast(`Goal → ${g.status}`);
}

// ═══════════════════════════════════════
// PHASE 2: SNOOZE WAKE-UP
// ═══════════════════════════════════════
function checkSnoozed(){
  const now=new Date();
  let woke=0;
  DB.tasks.forEach(t=>{
    if(t.status==='snoozed'&&t.snoozedUntil&&new Date(t.snoozedUntil)<=now){
      t.status='pending';t.snoozedUntil=null;woke++;
    }
  });
  if(woke>0){saveDB();toast(`⏰ ${woke} snoozed task${woke>1?'s':''} woke up`);}
}

// ═══════════════════════════════════════
// PHASE 2: BROWSER NOTIFICATIONS
// ═══════════════════════════════════════
function initNotifs(){
  if(!DB.settings.notifEnabled)return;
  if(!('Notification' in window))return;
  const el=document.getElementById('notif-status');
  if(el)el.textContent=Notification.permission==='granted'?'✅ Notifications active':'⚠ Permission not granted — click Request Permission';
  scheduleNotif();
}
function reqNotifPerm(){
  if(!('Notification' in window)){toast('Notifications not supported in this browser');return;}
  Notification.requestPermission().then(p=>{
    const el=document.getElementById('notif-status');
    if(p==='granted'){if(el)el.textContent='✅ Permission granted!';DB.settings.notifEnabled=true;saveDB();scheduleNotif();toast('Notifications enabled ✓');}
    else{if(el)el.textContent='❌ Permission denied';toast('Notifications denied');}
  });
}
function tglNotif(){
  DB.settings.notifEnabled=!DB.settings.notifEnabled;
  saveDB();render();
  toast(DB.settings.notifEnabled?'Notifications on':'Notifications off');
}
function scheduleNotif(){
  if(!DB.settings.notifEnabled||Notification.permission!=='granted')return;
  const [h,m]=(DB.settings.notifTime||'09:00').split(':').map(Number);
  const now=new Date(),target=new Date();
  target.setHours(h,m,0,0);
  if(target<=now)target.setDate(target.getDate()+1);
  const ms=target-now;
  if(window._notifTimer)clearTimeout(window._notifTimer);
  window._notifTimer=setTimeout(()=>{
    const top=topT();
    if(top){
      new Notification('Good morning! LifeBoard 🧠',{
        body:`Top priority: ${top.title}\n${si(top).txt}`,
        icon:'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">🧠</text></svg>'
      });
    }
    scheduleNotif(); // schedule next day
  },ms);
}
function sendWindowAlert(task){
  if(!DB.settings.notifEnabled||Notification.permission!=='granted')return;
  new Notification(`⏰ Window closing — ${task.title}`,{
    body:`This task's time window closes in 30 minutes. Do it now!`
  });
}

// INIT
function init(){
  document.documentElement.setAttribute('data-theme',DB.settings.theme||'dark');
  checkSnoozed();
  const c=document.getElementById('sba');
  AR.forEach(a=>{
    const d=document.createElement('div');d.className='si';d.setAttribute('data-v',`area-${a.id}`);
    d.onclick=()=>{AF='all';go('area',a.id);};
    const n=DB.tasks.filter(t=>t.areas.includes(a.id)&&t.status!=='done').length;
    d.innerHTML=`<span class="ic">${a.e}</span><span class="lbl">${a.label}</span>${n?`<span class="sbadge">${n}</span>`:''}`;
    c.appendChild(d);
  });
  document.getElementById('mchip').textContent={wspt:'📊 WSPT',edd:'📅 EDD',moore:'🧹 Moore'}[DB.settings.schedulingMode]||'📊 WSPT';
  updBadge();go('home');
  setInterval(render,5*60*1000);
  initNotifs();
}
pinInit(); // PIN gate — calls init() after successful auth
</script>
